spring:
  application:
    name: chef-control-api

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      # El audio de /ai/transcribe (TranscriptionService.MAX_BYTES). Las fotos validan sus 2 MB en su servicio.
      max-file-size: 4MB
      max-request-size: 5MB

  # Obligatorio con app.mail.provider=smtp (el default): sin usuario/clave la app no arranca. Gmail: puerto 587 + STARTTLS + contraseña de aplicación.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Sin timeouts un SMTP colgado cuelga el request (el envío es sincrónico).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  error:
    include-message: never

app:
  jwt:
    expiration-ms: 86400000

  backend:
    # URL pública de este backend (https). Va como notification_url en el checkout de los pagos únicos (suba de
    # plan). Vacía = MP avisa solo si el panel tiene activado el tópico "Pagos". Ver .env.example.
    public-url: ${BACKEND_PUBLIC_URL:}

  google-sign-in:
    # OAuth Client ID (tipo "Aplicación web") de Google Cloud Console. Es público: el front lo usa para el
    # botón y el back para exigir que el token sea para nuestra app. Vacío = el ingreso con Google rechaza todo.
    client-id: ${GOOGLE_CLIENT_ID:}

  cookie:
    secure: ${COOKIE_SECURE:false}
    # Partitioned sin Secure, Chrome rechaza la cookie entera: en local queda apagado.
    partitioned: false

  token:
    password-reset-expiration-minutes: 15
    set-password-expiration-hours: 48

  alerts:
    # Cuánto puede superar la merma registrada a mano a la estándar de limpieza antes de avisar.
    # 0.20 = 20%. Es un punto de partida elegido, no medido — ajustar con datos reales encima.
    waste-above-standard-threshold: ${WASTE_ABOVE_STANDARD_THRESHOLD:0.20}
    # Lunes a las 7. Configurable para poder correr el barrido a demanda sin esperar una semana.
    waste-sweep-cron: ${WASTE_SWEEP_CRON:0 0 7 * * MON}

  mail:
    # smtp (default). Un proveedor nuevo (ej. sendgrid) = una clase EmailSender + su valor acá.
    provider: ${MAIL_PROVIDER:smtp}
    # Gmail exige que sea la cuenta autenticada (o un alias suyo). Vacío = usa MAIL_USERNAME.
    from: ${MAIL_FROM:}

  payments:
    mercadopago:
      # Clave secreta del webhook (panel de MP > Webhooks). Sin ella /webhooks/mercadopago responde 503:
      # mejor rechazar todo que aceptar avisos sin poder verificar que vengan de MP.
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      # Access Token de la aplicación de MP. Sin él crear/cancelar suscripciones falla con
      # PAYMENT_PROVIDER_UNAVAILABLE. Usar el de PRUEBA fuera de producción.
      access-token: ${MP_ACCESS_TOKEN:}
    # Email de un comprador de prueba de MP. Solo con credenciales de prueba: MP rechaza un pagador real contra un
    # vendedor de prueba. Cargado, va como pagador en lugar del email del dueño. Vacío en producción.
    test-payer-email: ${MP_TEST_PAYER_EMAIL:}
    # Lo que se cobra por mes, en ARS. Cambiar acá NO actualiza las suscripciones ya creadas: cada una
    # tiene su monto en MP (el reajuste masivo es el endpoint admin, pendiente).
    plans:
      starter-amount-ars: ${SUBSCRIPTION_STARTER_AMOUNT_ARS:100000}
      pro-amount-ars: ${SUBSCRIPTION_PRO_AMOUNT_ARS:170000}
      # Valores de ejemplo (2026-10-12): el 225000 se asumió como ENTERPRISE, confirmar.
      enterprise-amount-ars: ${SUBSCRIPTION_ENTERPRISE_AMOUNT_ARS:225000}
      # El anual cuesta 12 meses menos este porcentaje, cobrado de una vez.
      annual-discount-percent: ${SUBSCRIPTION_ANNUAL_DISCOUNT_PERCENT:15}

  ai-service:
    timeout-seconds: 15

  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

  google:
    api-key: ${GOOGLE_AI_API_KEY:}
    model: ${GOOGLE_AI_MODEL:gemini-2.5-flash}

  # Audio a texto (/ai/transcribe). Sin clave, transcribir responde AI_TRANSCRIPTION_NOT_CONFIGURED.
  openai:
    api-key: ${OPENAI_API_KEY:}
    # Cuando OpenAI deprecie este, se cambia la variable en Railway, sin deploy.
    transcribe-model: ${OPENAI_TRANSCRIBE_MODEL:gpt-transcribe}

management:
  health:
    # El indicador de mail haría DOWN el /health (y el deploy) cuando el SMTP no está configurado.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
