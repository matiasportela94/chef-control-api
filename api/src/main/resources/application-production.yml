spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ChefControlPool

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}

  # El front (Vercel) y el back (Railway) son dominios distintos: sin SameSite=None el
  # navegador no manda la cookie y no hay sesion. Ademas None sin Secure el navegador lo
  # rechaza entero. Estaba solo en staging; aca dependia de variables de entorno invisibles.
  cookie:
    secure: true
    same-site: None

  frontend:
    url: ${FRONTEND_URL}

  token:
    password-reset-expiration-minutes: ${TOKEN_RESET_EXPIRATION_MINUTES:15}
    set-password-expiration-hours: ${TOKEN_SET_PASSWORD_EXPIRATION_HOURS:48}

  ai-service:
    url: ${AI_SERVICE_URL}
    secret: ${AI_SERVICE_SECRET}

  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN}
    access-token: ${WHATSAPP_ACCESS_TOKEN}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}

logging:
  level:
    com.chefcontrol: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
